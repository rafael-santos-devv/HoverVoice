    <rect x="28" y="32" width="4" height="20" rx="2"/>
    <rect x="36" y="28" width="4" height="28" rx="2"/>
    <rect x="44" y="32" width="4" height="20" rx="2"/>
    <rect x="52" y="36" width="4" height="12" rx="2"/>
